# Peak Price Pal — bundle layer.
#
# One row and no configuration. The Host half owns one owner-only balance
# route; the browser half owns the logo, the hover card, and the settings
# page. The row id stays stable across releases; the name is the package
# other people install.
- insert:
    - id: peak-price-pal
      name: dsh-peak-price-pal
